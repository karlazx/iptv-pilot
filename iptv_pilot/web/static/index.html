<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f6f7fb">
  <title>IPTVPilot</title>
  <link rel="stylesheet" href="/static/app.css?v=8">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#/epg" aria-label="IPTVPilot首页">
        <span class="brand-mark" aria-hidden="true">播</span>
        <span><strong>IPTVPilot</strong><small>家庭节目中枢</small></span>
      </a>
      <nav class="nav-list">
        <a href="#/epg" data-route="epg"><span aria-hidden="true">▦</span>节目单</a>
        <a href="#/subscriptions" data-route="subscriptions"><span aria-hidden="true">◎</span>订阅</a>
        <a href="#/recordings" data-route="recordings"><span aria-hidden="true">●</span>录制</a>
        <a href="#/summaries" data-route="summaries"><span aria-hidden="true">≡</span>摘要</a>
        <a href="#/bookmarks" data-route="bookmarks"><span aria-hidden="true">♡</span>收藏</a>
        <div class="nav-group" id="nav-group-settings">
          <button class="nav-group-toggle" type="button" aria-expanded="true" aria-controls="nav-group-settings-body">
            <span class="nav-group-icon" aria-hidden="true">⌁</span>
            <span class="nav-group-label">系统设置</span>
            <span class="nav-group-chevron" aria-hidden="true">▾</span>
          </button>
          <div class="nav-group-body" id="nav-group-settings-body">
            <a href="#/system" data-route="system"><span aria-hidden="true">⚙</span>通用设置</a>
            <a href="#/channels" data-route="channels"><span aria-hidden="true">▤</span>频道管理</a>
            <a href="#/sources" data-route="sources"><span aria-hidden="true">◈</span>直播源管理</a>
          </div>
        </div>
      </nav>
      <div class="sidebar-foot">
        <span class="live-dot"></span>
        <span>NAS 内网运行</span>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="page-eyebrow">IPTVPilot</p>
          <h1 id="page-title">节目单</h1>
        </div>
        <div class="topbar-actions">
          <span class="health-pill" id="health-pill"><i></i><span>正在连接</span></span>
          <button class="icon-button" id="refresh-button" type="button" title="刷新当前页面" aria-label="刷新当前页面">↻</button>
        </div>
      </header>
      <main id="view" tabindex="-1">
        <div class="page-loading"><span class="spinner"></span><p>正在加载管理台…</p></div>
      </main>
    </section>

    <nav class="mobile-nav" aria-label="移动端导航">
      <a href="#/epg" data-route="epg"><span>▦</span>节目单</a>
      <a href="#/channels" data-route="channels"><span>▤</span>频道</a>
      <a href="#/sources" data-route="sources"><span>◈</span>直播源</a>
      <a href="#/subscriptions" data-route="subscriptions"><span>◎</span>订阅</a>
      <a href="#/recordings" data-route="recordings"><span>●</span>录制</a>
      <a href="#/summaries" data-route="summaries"><span>≡</span>摘要</a>
      <a href="#/bookmarks" data-route="bookmarks"><span>♡</span>收藏</a>
      <a href="#/system" data-route="system"><span>⚙</span>设置</a>
    </nav>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header><h2 id="modal-title"></h2><button class="icon-button" data-close-modal type="button" aria-label="关闭">×</button></header>
      <div class="modal-body" id="modal-body"></div>
    </section>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite"></div>

  <script src="/static/hls.min.js?v=1.6.16" defer></script>
  <script src="/static/app.js?v=18" defer></script>
</body>
</html>
