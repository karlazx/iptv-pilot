name: iptv-pilot

x-app-environment: &app-environment
  TZ: ${TZ:-Asia/Shanghai}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MONGODB_URI: ${MONGODB_URI:-mongodb://iptv_user:change-me-iptv@mongodb:27017/iptv_pilot?authSource=iptv_pilot&replicaSet=rs0}
  MONGODB_DATABASE: ${MONGODB_DATABASE:-iptv_pilot}

x-worker: &worker
  image: iptv-pilot:${APP_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      INSTALL_AI_DEPS: ${INSTALL_AI_DEPS:-0}
      INSTALL_FFMPEG: ${INSTALL_FFMPEG:-1}
      INSTALL_EMBEDDING_DEPS: ${INSTALL_EMBEDDING_DEPS:-0}
      PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
  restart: unless-stopped
  env_file: .env
  environment: *app-environment
  depends_on:
    mongo-init:
      condition: service_completed_successfully
  networks: [iptv]

services:
  mongodb:
    image: mongodb/mongodb-community-server:${MONGODB_SERVER_TAG:-8.2.0-ubi9}
    restart: unless-stopped
    command: ["mongod", "--config", "/etc/mongod.conf"]
    volumes:
      - ${MONGODB_DATA_PATH:-/nas/iptv/db}:/data/db
      - ./config/mongod.conf:/etc/mongod.conf:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 2)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 2g
    networks: [iptv]

  mongo-init:
    image: mongodb/mongodb-community-server:${MONGODB_SERVER_TAG:-8.2.0-ubi9}
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_DATABASE: ${MONGODB_DATABASE:-iptv_pilot}
      IPTV_DB_USER: ${IPTV_DB_USER:-iptv_user}
      IPTV_DB_PASSWORD: ${IPTV_DB_PASSWORD:-change-me-iptv}
      MONGOT_PASSWORD: ${MONGOT_PASSWORD:-change-me-mongot}
    volumes:
      - ./scripts/init_mongo.js:/scripts/init_mongo.js:ro
    entrypoint: ["mongosh", "--host", "mongodb:27017", "--file", "/scripts/init_mongo.js"]
    networks: [iptv]

  mongot-secrets:
    image: alpine:3.22
    restart: "no"
    environment:
      MONGOT_PASSWORD: ${MONGOT_PASSWORD:-change-me-mongot}
    command: ["sh", "-c", "umask 077 && printf %s \"$$MONGOT_PASSWORD\" > /secrets/passwordFile"]
    volumes:
      - mongot-secrets:/secrets
    networks: [iptv]

  mongot:
    image: mongodb/mongodb-community-search:${MONGOT_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      mongot-secrets:
        condition: service_completed_successfully
    volumes:
      - ${MONGOT_DATA_PATH:-/nas/iptv/db-search}:/data/mongot
      - ./config/mongot.conf:/mongot-community/config.default.yml:ro
      - mongot-secrets:/secrets:ro
    expose:
      - "27028"
      - "8080"
      - "9946"
    mem_limit: 2g
    networks: [iptv]

  search-init:
    image: mongodb/mongodb-community-server:${MONGODB_SERVER_TAG:-8.2.0-ubi9}
    restart: "no"
    depends_on:
      mongot:
        condition: service_started
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://iptv_user:change-me-iptv@mongodb:27017/iptv_pilot?authSource=iptv_pilot&replicaSet=rs0}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-iptv_pilot}
    volumes:
      - ./scripts/init_search.js:/scripts/init_search.js:ro
    entrypoint: ["mongosh", "--nodb", "--file", "/scripts/init_search.js"]
    networks: [iptv]

  iptv-api:
    image: ${IPTV_API_IMAGE:-guovern/iptv-api:latest}
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${IPTV_API_PUBLIC_DOMAIN:-127.0.0.1}
      PUBLIC_PORT: ${IPTV_API_PUBLIC_PORT:-5181}
      UPDATE_MODE: time
      UPDATE_TIMES: "04:00"
      TIME_ZONE: ${TZ:-Asia/Shanghai}
      IPV_TYPE: ${IPTV_API_IPV_TYPE:-ipv4}
      IPV_TYPE_PREFER: ${IPTV_API_IPV_TYPE_PREFER:-ipv4}
      OPEN_RTMP: "False"
    ports:
      - "${IPTV_API_PUBLIC_PORT:-5181}:8080"
    volumes:
      - ${IPTV_API_CONFIG_PATH:-/nas/iptv/iptv-api-config}:/iptv-api/config
      - ${M3U_DATA_PATH:-/nas/iptv/m3u}:/iptv-api/output
    networks: [iptv]

  channel-sync:
    <<: *worker
    command:
      ["python", "/app/scripts/seed_channels.py", "${M3U_PATH:-/data/m3u/result.m3u}", "--watch"]
    environment:
      <<: *app-environment
      CHANNEL_SYNC_INTERVAL_SECONDS: ${CHANNEL_SYNC_INTERVAL_SECONDS:-300}
    volumes:
      - ${M3U_DATA_PATH:-/nas/iptv/m3u}:/data/m3u:ro

  stream-quality:
    <<: *worker
    command: ["python", "-m", "scripts.refresh_stream_quality", "--watch"]
    environment:
      <<: *app-environment
      STREAM_QUALITY_INTERVAL_SECONDS: ${STREAM_QUALITY_INTERVAL_SECONDS:-3600}
      STREAM_QUALITY_SAMPLE_COUNT: ${STREAM_QUALITY_SAMPLE_COUNT:-2}
      STREAM_QUALITY_TIMEOUT_SECONDS: ${STREAM_QUALITY_TIMEOUT_SECONDS:-20}
      STREAM_QUALITY_WORKERS: ${STREAM_QUALITY_WORKERS:-3}

  live-normalizer:
    image: iptv-pilot:${APP_TAG:-local}-live-normalizer
    profiles: ["hardware-accel"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_AI_DEPS: 0
        INSTALL_FFMPEG: 0
        INSTALL_SYSTEM_FFMPEG: 1
        INSTALL_EMBEDDING_DEPS: 0
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://deb.debian.org}
    restart: unless-stopped
    command: ["python", "-m", "iptv_pilot.live_normalizer.main"]
    env_file: .env
    environment:
      <<: *app-environment
      LIVE_NORMALIZE_CHANNELS: ${LIVE_NORMALIZE_CHANNELS:-}
      LIVE_NORMALIZE_MAX_CHANNELS: ${LIVE_NORMALIZE_MAX_CHANNELS:-2}
      LIVE_NORMALIZE_ROOT: /data/media-cache/live-hls
      LIVE_NORMALIZE_VAAPI_DEVICE: /dev/dri/renderD128
      LIVE_NORMALIZE_WIDTH: ${LIVE_NORMALIZE_WIDTH:-1280}
      LIVE_NORMALIZE_HEIGHT: ${LIVE_NORMALIZE_HEIGHT:-720}
      LIVE_NORMALIZE_FPS: ${LIVE_NORMALIZE_FPS:-25}
      LIVE_NORMALIZE_VIDEO_BITRATE: ${LIVE_NORMALIZE_VIDEO_BITRATE:-3500k}
      LIVE_NORMALIZE_VIDEO_MAXRATE: ${LIVE_NORMALIZE_VIDEO_MAXRATE:-4000k}
      LIVE_NORMALIZE_VIDEO_BUFSIZE: ${LIVE_NORMALIZE_VIDEO_BUFSIZE:-8000k}
      LIVE_NORMALIZE_HLS_LIST_SIZE: ${LIVE_NORMALIZE_HLS_LIST_SIZE:-30}
      LIVE_NORMALIZE_HLS_DELETE_THRESHOLD: ${LIVE_NORMALIZE_HLS_DELETE_THRESHOLD:-10}
      LIVE_NORMALIZE_STALE_SECONDS: ${LIVE_NORMALIZE_STALE_SECONDS:-60}
      LIVE_NORMALIZE_PUBLISH_INTERVAL: ${LIVE_NORMALIZE_PUBLISH_INTERVAL:-2}
      LIVE_NORMALIZE_PUBLISH_PREBUFFER: ${LIVE_NORMALIZE_PUBLISH_PREBUFFER:-10}
      LIVE_NORMALIZE_MAX_AV_DRIFT_SECONDS: ${LIVE_NORMALIZE_MAX_AV_DRIFT_SECONDS:-3}
      LIVE_NORMALIZE_MAX_TRACK_DURATION_SECONDS: ${LIVE_NORMALIZE_MAX_TRACK_DURATION_SECONDS:-4.5}
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - ${MEDIA_CACHE_PATH:-/nas/iptv/media-cache}:/data/media-cache
    mem_limit: 2g
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    networks: [iptv]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; p='/data/media-cache/live-hls'; files=[os.path.join(r,f) for r,_,n in os.walk(p) for f in n if f=='index.m3u8']; raise SystemExit(0 if files and time.time()-max(os.path.getmtime(x) for x in files)<60 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  epg-engine:
    <<: *worker
    command: ["python", "-m", "iptv_pilot.epg_engine.main"]
    environment:
      <<: *app-environment
      EPG_URLS: ${EPG_URLS:-/data/m3u/epg/epg.xml}
      EPG_REFRESH_MINUTES: ${EPG_REFRESH_MINUTES:-30}
      EPG_REQUEST_TIMEOUT: ${EPG_REQUEST_TIMEOUT:-90}
    volumes:
      - ${M3U_DATA_PATH:-/nas/iptv/m3u}:/data/m3u:ro

  scheduler:
    <<: *worker
    command: ["python", "-m", "iptv_pilot.scheduler.main"]
    environment:
      <<: *app-environment
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
      SCHEDULER_HORIZON_MINUTES: ${SCHEDULER_HORIZON_MINUTES:-15}
      RECORDING_PRE_ROLL_SECONDS: ${RECORDING_PRE_ROLL_SECONDS:-60}
      RECORDING_POST_ROLL_SECONDS: ${RECORDING_POST_ROLL_SECONDS:-180}

  recorder:
    <<: *worker
    command: ["python", "-m", "iptv_pilot.recorder.main"]
    environment:
      <<: *app-environment
      RECORDING_POLL_SECONDS: ${RECORDING_POLL_SECONDS:-5}
      RECORDING_MIN_BYTES: ${RECORDING_MIN_BYTES:-1048576}
      RECORDING_MAX_RETRIES: ${RECORDING_MAX_RETRIES:-2}
      RECORDING_STALE_SECONDS: ${RECORDING_STALE_SECONDS:-600}
      FFMPEG_BIN: ${FFMPEG_BIN:-auto}
    volumes:
      - ${RECORDINGS_PATH:-/nas/iptv/recordings}:/data/recordings
      - ${M3U_DATA_PATH:-/nas/iptv/m3u}:/data/m3u:ro

  asr:
    <<: *worker
    command: ["python", "-m", "iptv_pilot.asr.main"]
    environment:
      <<: *app-environment
      ASR_BACKEND: ${ASR_BACKEND:-mock}
      ASR_MODEL: ${ASR_MODEL:-small}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-int8}
      ASR_DEVICE: ${ASR_DEVICE:-cpu}
      ASR_POLL_SECONDS: ${ASR_POLL_SECONDS:-10}
      ASR_MAX_RETRIES: ${ASR_MAX_RETRIES:-2}
      ASR_STALE_SECONDS: ${ASR_STALE_SECONDS:-600}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-}
      HTTP_PROXY: ${MODEL_HTTP_PROXY:-}
      HTTPS_PROXY: ${MODEL_HTTP_PROXY:-}
      NO_PROXY: ${MODEL_NO_PROXY:-localhost,127.0.0.1,mongodb,mongot}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-sentence_transformers}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
    volumes:
      - ${RECORDINGS_PATH:-/nas/iptv/recordings}:/data/recordings:ro
      - ${MODELS_PATH:-/nas/iptv/models}:/root/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 3g

  llm:
    <<: *worker
    command: ["python", "-m", "iptv_pilot.llm.main"]
    environment:
      <<: *app-environment
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-doubao-seed-1-6-250615}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-60000}
      LLM_POLL_SECONDS: ${LLM_POLL_SECONDS:-10}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      LLM_STALE_SECONDS: ${LLM_STALE_SECONDS:-300}

  push:
    <<: *worker
    command: ["python", "-m", "iptv_pilot.push.main"]
    environment:
      <<: *app-environment
      PUSH_PROVIDER: ${PUSH_PROVIDER:-none}
      PUSH_EMAIL_MODE: ${PUSH_EMAIL_MODE:-fallback}
      PUSH_POLL_SECONDS: ${PUSH_POLL_SECONDS:-10}
      PUSH_MAX_RETRIES: ${PUSH_MAX_RETRIES:-3}
      COZE_BOT_ID: ${COZE_BOT_ID:-}
      COZE_API_TOKEN: ${COZE_API_TOKEN:-}
      COZE_API_BASE: ${COZE_API_BASE:-https://api.coze.cn}
      COZE_USER_ID: ${COZE_USER_ID:-iptv_pilot}
      COZE_TIMEOUT_SECONDS: ${COZE_TIMEOUT_SECONDS:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}

  web:
    <<: *worker
    image: iptv-pilot:${APP_TAG:-local}-web
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_AI_DEPS: 0
        INSTALL_FFMPEG: 0
        INSTALL_SYSTEM_FFMPEG: 0
        INSTALL_EMBEDDING_DEPS: 0
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://deb.debian.org}
    command: ["python", "-m", "iptv_pilot.web.main"]
    environment:
      <<: *app-environment
      WEB_HOST: ${WEB_HOST:-0.0.0.0}
      WEB_PORT: 8080
      WEB_CORS_ORIGINS: ${WEB_CORS_ORIGINS:-http://localhost:8080}
      WEB_API_TOKEN: ${WEB_API_TOKEN:-}
      RECORDINGS_ROOT: /data/recordings
      MEDIA_CACHE_DIR: /data/media-cache
      MEDIA_CACHE_MAX_BYTES: ${MEDIA_CACHE_MAX_BYTES:-21474836480}
      MEDIA_REMUX_TIMEOUT_SECONDS: ${MEDIA_REMUX_TIMEOUT_SECONDS:-300}
      LIVE_PROXY_TIMEOUT_SECONDS: ${LIVE_PROXY_TIMEOUT_SECONDS:-20}
      LIVE_TOKEN_TTL_SECONDS: ${LIVE_TOKEN_TTL_SECONDS:-900}
      LIVE_NORMALIZE_CHANNELS: ${LIVE_NORMALIZE_CHANNELS:-}
      LIVE_NORMALIZE_ROOT: /data/media-cache/live-hls
      LIVE_NORMALIZE_STALE_SECONDS: ${LIVE_NORMALIZE_STALE_SECONDS:-60}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-none}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ${RECORDINGS_PATH:-/nas/iptv/recordings}:/data/recordings:ro
      - ${MEDIA_CACHE_PATH:-/nas/iptv/media-cache}:/data/media-cache
      - ${MODELS_PATH:-/nas/iptv/models}:/root/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  backup:
    image: mongodb/mongodb-community-server:${MONGODB_SERVER_TAG:-8.2.0-ubi9}
    profiles: ["maintenance"]
    restart: "no"
    env_file: .env
    environment:
      IPTV_DATA_ROOT: /data
      MONGODB_URI: ${MONGODB_URI:-mongodb://iptv_user:change-me-iptv@mongodb:27017/iptv_pilot?authSource=iptv_pilot&replicaSet=rs0}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-iptv_pilot}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ${BACKUP_PATH:-/nas/iptv/backup}:/data/backup
    entrypoint: ["sh", "/scripts/backup.sh"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    networks: [iptv]

  cleanup-recordings:
    <<: *worker
    profiles: ["maintenance"]
    restart: "no"
    command: ["python", "/app/scripts/cleanup_recordings.py"]
    environment:
      <<: *app-environment
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-30}
    volumes:
      - ./scripts:/app/scripts:ro
      - ${RECORDINGS_PATH:-/nas/iptv/recordings}:/data/recordings

networks:
  iptv:
    driver: bridge

volumes:
  mongot-secrets:
