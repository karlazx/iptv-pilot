name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deployment-tool-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Verify standalone NAS deployment tool
        run: python -m scripts.deploy --help

  python:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongodb/mongodb-community-server:8.2.0-ubi9
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]' av==18.1.0 numpy==2.5.4
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: cp .env.example .env && docker compose config --quiet
      - name: Build lightweight web image
        run: docker compose build web
      - name: Verify media dependencies without Whisper
        run: docker run --rm --entrypoint python iptv-pilot:local -c "import av, numpy, imageio_ffmpeg, importlib.util; assert importlib.util.find_spec('faster_whisper') is None"
      - name: Validate deployment modes
        run: |
          COMPOSE_PROFILES=split,ai docker compose config --quiet
          COMPOSE_PROFILES=compact,ai,iptv-api docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.search.yml --profile search config --quiet
