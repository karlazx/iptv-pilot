name: Release

on:
  # Manual runs warm persistent caches without publishing runtime images/releases.
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  images:
    name: Build ${{ matrix.variant }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: app
            suffix: ""
            build_args: |
              INSTALL_AI_DEPS=0
              INSTALL_FFMPEG=1
              INSTALL_SYSTEM_FFMPEG=0
              INSTALL_EMBEDDING_DEPS=0
          - variant: ai
            suffix: -ai
            build_args: |
              INSTALL_AI_DEPS=1
              INSTALL_FFMPEG=1
              INSTALL_SYSTEM_FFMPEG=0
              INSTALL_EMBEDDING_DEPS=0
          - variant: live-normalizer
            suffix: -live-normalizer
            build_args: |
              INSTALL_AI_DEPS=0
              INSTALL_FFMPEG=0
              INSTALL_SYSTEM_FFMPEG=1
              INSTALL_EMBEDDING_DEPS=0
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/karlazx/iptv-pilot
          tags: |
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}},suffix=${{ matrix.suffix }},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=cache-preview-${{ matrix.variant }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          # GHA caches are ref-scoped: a new release tag cannot reuse a previous
          # tag's dependency layers. Registry cache references survive tag changes.
          cache-from: type=registry,ref=ghcr.io/karlazx/iptv-pilot:buildcache-${{ matrix.variant }}
          cache-to: type=registry,ref=ghcr.io/karlazx/iptv-pilot:buildcache-${{ matrix.variant }},mode=max,image-manifest=true,oci-mediatypes=true
          sbom: true
          provenance: mode=max

  github-release:
    if: github.event_name == 'push'
    name: Create GitHub release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi

          release_args=(--verify-tag --title "IPTVPilot $GITHUB_REF_NAME")
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            release_args+=(--notes-file "$notes_file")
          else
            release_args+=(--generate-notes)
          fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          fi

          gh release create "$GITHUB_REF_NAME" "${release_args[@]}"
