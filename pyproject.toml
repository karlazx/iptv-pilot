[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iptv-pilot"
version = "0.1.0"
description = "Smart IPTV subscriptions, channel management, and program digests."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "karlazx", email = "karlaz.x@outlook.com" }]
dependencies = [
  "APScheduler==3.11.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "openai==1.99.9",
  "pydantic==2.11.7",
  "pymongo==4.17.0",
  "python-multipart==0.0.20",
  "tenacity==9.1.2",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
ai = ["faster-whisper==1.1.1", "requests==2.32.5"]
embedding = ["sentence-transformers==5.1.0"]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.urls]
Homepage = "https://github.com/karlazx/iptv-pilot"
Documentation = "https://github.com/karlazx/iptv-pilot/tree/main/docs"
Issues = "https://github.com/karlazx/iptv-pilot/issues"

[tool.setuptools.packages.find]
include = ["iptv_pilot*"]

[tool.setuptools.package-data]
"iptv_pilot.web" = ["static/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
